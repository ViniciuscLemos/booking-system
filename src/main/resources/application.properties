spring.application.name=booking-system

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# the business's rules (see BookingPolicy)
booking.zone=America/Sao_Paulo
booking.min-notice=2h
booking.max-advance=60d
booking.slot-step=15m
booking.business-name=Northside Barbers
