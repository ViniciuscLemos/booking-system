spring.application.name=booking-system
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# the business's rules (see BookingPolicy)
booking.zone=America/Sao_Paulo
booking.min-notice=2h
booking.max-advance=60d
booking.slot-step=15m
booking.business-name=Northside Barbers
booking.business-address=Rua dos Pinheiros 412, S\u00e3o Paulo

# the first login of the business; only used while there is none yet (see OwnerSetup)
booking.owner.name=${OWNER_NAME:Owner}
booking.owner.email=${OWNER_EMAIL:}
booking.owner.password=${OWNER_PASSWORD:}

# the staff login lasts a work day
server.servlet.session.timeout=12h
server.servlet.session.cookie.same-site=strict
