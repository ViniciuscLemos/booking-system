# one pull request a month, grouped, so updates don't pile up
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
    # a new major is a planned upgrade, not a bump
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
